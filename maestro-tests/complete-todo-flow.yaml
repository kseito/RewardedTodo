appId: jp.kztproject.rewardedtodo.debug
tags:
  - android
  - rewardedtodo
---
# Todoistから同期したタスクを完了すると、サーバーがポイントを加算しチケットが増える。
- runScript: stubs/complete-todo.js
- clearState
- launchApp

# Wait for the initial screen to finish rendering; cold start/JIT is slow on CI
- runFlow: subflows/authenticate.yaml

# Todoistから同期されたタスクが一覧に出る
- extendedWaitUntil:
    visible: "Task to Complete"
    timeout: 15000

# 完了するとリストから消える
- tapOn:
    text: "todo_checkbox"
    index: 0
- extendedWaitUntil:
    notVisible: "Task to Complete"
    timeout: 10000

# サーバーがポイントを加算した結果が反映される
- tapOn:
    text: "Reward"
- extendedWaitUntil:
    visible: "1 tickets"
    timeout: 10000
