appId: jp.kztproject.rewardedtodo.debug
---
# 起動時の認証画面でTodoist連携を済ませる。
# `e2e` ビルドタイプでビルドしたアプリでは、認可はブラウザを介さず
# MockTodoistAuthTabLauncherが即座に成功を返す。
- extendedWaitUntil:
    visible: "Connect to Todoist"
    timeout: 180000
- tapOn: "Connect to Todoist"
- extendedWaitUntil:
    visible: "Reward"
    timeout: 30000
