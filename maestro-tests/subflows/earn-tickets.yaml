appId: jp.kztproject.rewardedtodo.debug
---
# フェイクが配信した "Earn Ticket" タスクを完了し、サーバーが加算したチケットを受け取る。
# Reward画面は表示のたびに残数を引き直すため、プルリフレッシュは不要。
- tapOn:
    text: "Todo"
- extendedWaitUntil:
    visible: "Earn Ticket"
    timeout: 15000
- tapOn:
    text: "todo_checkbox"
    index: 0
- extendedWaitUntil:
    notVisible: "Earn Ticket"
    timeout: 15000
- tapOn:
    text: "Reward"
- extendedWaitUntil:
    notVisible:
      text: "0 tickets"
    timeout: 15000
