appId: jp.kztproject.rewardedtodo.debug
tags:
  - android
  - rewardedtodo
---
# Todoistから同期したTodoを詳細シートから削除すると一覧から消える。
- runScript: stubs/one-todo.js
- clearState
- launchApp

# Wait for the initial screen to finish rendering; cold start/JIT is slow on CI
- runFlow: subflows/authenticate.yaml

# Todoistから同期されたタスクが一覧に出る
- extendedWaitUntil:
    visible: "Synced Task"
    timeout: 15000

# Tap on the task to open bottom sheet
- tapOn:
    text: "Synced Task"

# Wait for bottom sheet to appear
- assertVisible: "Title"

# Tap Delete button
- tapOn: "Delete"

# Verify the task is deleted from the list
- assertNotVisible: "Synced Task"
