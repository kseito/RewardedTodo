appId: jp.kztproject.rewardedtodo.debug
tags:
  - android
  - rewardedtodo
---
# Todo名は読み取り専用。獲得数をサーバーに保存し再起動後も反映する。
- runScript: stubs/one-todo.js
- clearState
- launchApp
- runFlow: subflows/authenticate.yaml
- extendedWaitUntil:
    visible: "Synced Task"
    timeout: 15000
- tapOn: "Synced Task"
- assertVisible: "Save"
- assertNotVisible: "Delete"
- swipe:
    from:
      text: "ticket_number_picker"
    direction: UP
    duration: 500
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 10000
- assertVisible: "Synced Task"
- runScript: stubs/capture-saved-reward.js
- assertVisible:
    text: "${output.savedReward}"
    below: "Synced Task"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Synced Task"
    timeout: 15000
- assertVisible:
    text: "${output.savedReward}"
    below: "Synced Task"
