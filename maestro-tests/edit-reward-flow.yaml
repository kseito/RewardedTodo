appId: jp.kztproject.rewardedtodo.debug
tags:
  - android
  - rewardedtodo
---
- runScript: stubs/reset.js
- clearState
- launchApp

# Wait for the initial screen to finish rendering; cold start/JIT is slow on CI
- runFlow: subflows/authenticate.yaml

# Navigate to Reward tab
- tapOn:
    text: "Reward"

# Add a reward to edit (Repeat is left unchecked)
- tapOn:
    text: "Add"

# Wait for bottom sheet to appear
- assertVisible: "Reward Title"

# Enter reward title
- tapOn: "Reward Title"
- inputText: "Reward to Edit"

# Enter reward description
- tapOn: "Reward Description"
- inputText: "Before editing"

# Enter chance of winning
- tapOn: 'Chance of Winning\(Unit %\)'
- inputText: "20"

# Tap Save button
- hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Reward Title"
    timeout: 5000

# Wait for the reward to appear in the list
- extendedWaitUntil:
    visible: "Reward to Edit"
    timeout: 5000

# The reward has no repeat label yet
- assertNotVisible: "Repeat reward"

# Tap on the reward to open the detail bottom sheet
- tapOn:
    text: "Reward to Edit"

# Wait for bottom sheet to appear
- assertVisible: "Reward Title"

# Turn on the Repeat switch
- tapOn:
    text: "repeat_checkbox"

# Save the changes
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Reward Title"
    timeout: 5000

# Verify the reward now shows the repeat label in the list
- extendedWaitUntil:
    visible: "Repeat reward"
    timeout: 5000
- assertVisible: "Reward to Edit"
