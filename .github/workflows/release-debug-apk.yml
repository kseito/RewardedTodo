name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '最新の debug-x.y.z から上げる桁'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          latest=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^debug-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^debug-//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n 1 || true)

          if [ -z "${latest}" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest}"
            case "${BUMP}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              *)     next="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          tag="debug-${next}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Error: release ${tag} already exists" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "🏷️ Release tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: ./.github/actions/setup-java

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle

      - name: Inject secrets into local.properties
        run: echo "reward.server.url=${{ secrets.REWARD_SERVER_URL }}" >> local.properties

      - name: Decode debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create GitHub Release with debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "${TAG}" \
            --generate-notes \
            --target "${{ github.sha }}"
