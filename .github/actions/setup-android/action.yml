name: 'Setup Android SDK'
description: 'Setup the Android SDK with default configuration for this project'

inputs:
  packages:
    # setup-android のデフォルト値 `tools platform-tools` に含まれる `tools` は
    # SDK リポジトリから取得できず sdkmanager が失敗するため、platform-tools のみを既定とする。
    description: 'Android SDK packages to install'
    required: false
    default: 'platform-tools'

runs:
  using: 'composite'
  steps:
    - name: Setup Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ${{ inputs.packages }}
